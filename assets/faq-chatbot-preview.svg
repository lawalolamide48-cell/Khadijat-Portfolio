<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f1e9e1"/><rect x="100" y="50" width="1000" height="575" rx="24" fill="#fff"/><rect x="100" y="50" width="1000" height="85" rx="24" fill="#fffaf6"/><rect x="100" y="110" width="1000" height="25" fill="#fffaf6"/><circle cx="150" cy="93" r="21" fill="#9a5b3a"/><path d="M140 86h20M140 94h14M140 102h17" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="190" y="88" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#342820">Support assistant</text><text x="190" y="112" font-family="Arial,sans-serif" font-size="14" fill="#8a7c72">FAQ chatbot · Usually replies instantly</text><rect x="145" y="175" width="600" height="70" rx="15" fill="#f7f2ee"/><text x="170" y="204" font-family="Arial,sans-serif" font-size="17" fill="#55483f">Hello! What can I help you with today?</text><text x="170" y="227" font-family="Arial,sans-serif" font-size="14" fill="#8a7c72">Choose a topic or type your question below.</text><rect x="520" y="275" width="510" height="62" rx="15" fill="#9a5b3a"/><text x="550" y="312" font-family="Arial,sans-serif" font-size="17" fill="#fff">How do I update my account details?</text><rect x="145" y="365" width="670" height="98" rx="15" fill="#f7f2ee"/><text x="170" y="396" font-family="Arial,sans-serif" font-size="17" fill="#55483f">You can update your details from Account Settings.</text><text x="170" y="424" font-family="Arial,sans-serif" font-size="16" fill="#55483f">Open your profile, choose “Edit details,” and save</text><text x="170" y="448" font-family="Arial,sans-serif" font-size="16" fill="#55483f">your changes. Would you like help with anything else?</text><rect x="145" y="520" width="885" height="55" rx="27" fill="#fff" stroke="#ded3ca" stroke-width="2"/><text x="175" y="554" font-family="Arial,sans-serif" font-size="17" fill="#a79a90">Type your question...</text><circle cx="987" cy="548" r="18" fill="#9a5b3a"/><path d="M978 548l7 7 12-15" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>